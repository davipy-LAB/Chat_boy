<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBoy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_chat.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="icon" href="https://example.com/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="tsparticles"></div>
    <div class="overlay" id="overlay"></div> 
    <div class="container">
        <div class="chat">
            <div class="chat-header">
                <h1>ChatBoy</h1>
            </div>
            <div class="chat-body" id="chatBody">
                <div class="chat-message bot">
                    <div class="message-content">
                        <p class="message-text">Olá, eu sou o ChatBoy! Como posso ajudar você hoje?</p>
                    </div>
                </div>
                <div class="chat-message-user">
                    <div class="message-content user"></div>
                </div>
            </div>
            <div class="chat-input">
                <form id="uploadForm" enctype="multipart/form-data" style="margin:0; padding:0;">
                    <label for="file" id="uploadLabel">
                        <i class="fas fa-paperclip"></i>
                        <input type="file" name="file" id="file" accept=".xlsx,.xls" required style="display:none;">
                    </label>
                </form>
                <input type="text" id="userInput" placeholder="Digite sua mensagem aqui...">
                <button id="sendButton"><i class="fas fa-paper-plane"></i></button>
            </div>
            <div id="uploadResult" style="margin-bottom: 10px; color: #fff;"></div>
        </div>
    </div>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="text">
                <h1>ChatBoy</h1>
            </div>
        </div>
        <div class="sidebar-body">
            <p>Desenvolvido por: <a href="https://github.com/davipy-LAB" target="_blank">Davi Dias</a></p>
        </div>
        <div class="sidebar-footer">
            <p>© 2025 ChatBoy. Todos os direitos reservados.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script>
    // Partículas de fundo
    tsParticles.load("tsparticles", {
      particles: {
        number: { value: 80 },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5 },
        size: { value: 3 },
        move: { enable: true, speed: 1 },
        links: {
          enable: true,
          color: "#ffffff",
          distance: 150,
          opacity: 0.4,
          width: 1
        }
      },
      interactivity: {
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { quantity: 4 }
        }
      },
      background: {
        color: "#0d1117"
      }
    });
    </script>
</body>
</html>
